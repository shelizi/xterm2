name: CI
on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test --exclude-tags platform-golden
      - name: Test extracted pure-Dart terminal core
        working-directory: core
        run: dart test
      - name: Report upstream golden compatibility
        continue-on-error: true
        run: flutter test --tags platform-golden
